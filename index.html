<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cumpleaños</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,800;1,800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fw"></canvas>
  <canvas id="scene"></canvas>

  <button id="btnFull" class="round left" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M9 21v-4a2 2 0 0 0-2-2H3M15 21v-4a2 2 0 0 1 2-2h4"/>
    </svg>
  </button>
  <button id="btnMusic" class="round right" aria-label="Música">♫</button>

  <section id="intro">
    <h1 class="hb">Happy Birthday</h1>
    <p class="hint">Arrastra para girar</p>
    <p class="msg">¡Feliz cumpleaños, mi amor! 💖 Que tu día esté lleno de sonrisas, abrazos y sueños cumplidos.<br>Eres un regalo hermoso para mi corazón. 💖</p>
    <p class="call">UN UNIVERSO TE ESPERA HAZ CLIC EN INICIAR</p>
    <button id="btnStart">INICIAR</button>
  </section>

  <h2 id="title" class="hidden">FELIZ CUMPLEAÑOS PPRECIOSA 🎂💖</h2>

  <div id="modal" class="hidden">
    <div class="card">
      <div class="heart">♥</div>
      <div class="photo"><img id="mImg" alt=""></div>
      <h3 id="mTitle"></h3>
      <p id="mText"></p>
      <button id="mClose">CERRAR ✦</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
